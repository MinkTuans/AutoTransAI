name: Windows desktop candidate
on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-desktop
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build, audit and smoke-test frozen backend
        shell: pwsh
        run: |
          try {
            & ./desktop/scripts/build.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/desktop-build.log"
          } catch {
            $tail = (Get-Content "$env:RUNNER_TEMP/desktop-build.log" -Tail 60 -ErrorAction SilentlyContinue) -join "`n"
            $exception = ($_ | Out-String)
            if ($exception.Length -gt 3000) { $exception = $exception.Substring(0, 3000) }
            if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
            $exception = $exception.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows desktop build exception::$exception"
            Write-Output "::error title=Windows desktop build log tail::$tail"
            throw
          }
      - name: Compile per-user installer (Microsoft online WebView2 bootstrap)
        shell: pwsh
        run: |
          try {
            & ./desktop/scripts/package.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/desktop-package.log"
          } catch {
            $tail = (Get-Content "$env:RUNNER_TEMP/desktop-package.log" -Tail 60 -ErrorAction SilentlyContinue) -join "`n"
            $exception = ($_ | Out-String)
            if ($exception.Length -gt 3000) { $exception = $exception.Substring(0, 3000) }
            if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
            $exception = $exception.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installer exception::$exception"
            Write-Output "::error title=Windows installer log tail::$tail"
            throw
          }
      - name: Accept actual installed package and uninstall
        shell: pwsh
        run: ./desktop/scripts/smoke-installed.ps1
      - name: Record candidate hashes and smoke evidence
        shell: pwsh
        run: |
          $version = (Get-Content desktop/packaging/version.txt -Raw).Trim()
          foreach ($path in @('dist/AutoTransAI/AutoTransAI.exe', "dist/installer/AutoTransAI-$version-Setup.exe")) {
            $file = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output "::notice title=Unsigned candidate evidence::$($file.Name); bytes=$($file.Length); sha256=$hash; source=$env:GITHUB_SHA"
          }
          Write-Output '::notice title=Frozen backend smoke evidence::Passed actual windowed executable authenticated startup, anonymous UI rejection, cookie UI/API access and owned shutdown with disposable Unicode-path data. Installed acceptance is separately gated; full interactive/media acceptance remains pending.'
      - name: Retain unsigned candidate and provenance
        uses: actions/upload-artifact@v4
        with:
          name: AutoTransAI-Windows-x64-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/AutoTransAI/
            dist/installer/
      - name: State acceptance boundary
        shell: pwsh
        run: |
          'Build artifacts are unsigned candidates. Installed smoke covers silent installation, shortcuts, backend restart and uninstall. See installed-acceptance.json for GUI capability and one-run timings; clean-machine, interactive, OAuth, media and performance matrix remain separate.' >> $env:GITHUB_STEP_SUMMARY
